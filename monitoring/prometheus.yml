global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'monitoring-node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'app-node'
    static_configs:
      - targets: ['REPLACE_APP_PRIVATE_IP:9100']

  - job_name: 'app-cadvisor'
    static_configs:
      - targets: ['REPLACE_APP_PRIVATE_IP:8080']
